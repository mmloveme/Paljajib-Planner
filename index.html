<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Palja Jib Planner</title>
  <meta name="theme-color" content="#f4f5f7">
  <meta name="description" content="네일아트 예약을 월간/주간 캘린더와 일일 예약 리스트로 관리하는 개인용 플래너">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root {
      --bg: #f2f3f7;
      --bg-soft: #fafbfc;
      --panel: rgba(255, 255, 255, 0.78);
      --panel-strong: rgba(255, 255, 255, 0.94);
      --line: rgba(21, 30, 44, 0.08);
      --line-strong: rgba(21, 30, 44, 0.14);
      --text: #111827;
      --muted: #6b7280;
      --accent: #1f6fff;
      --accent-soft: rgba(31, 111, 255, 0.12);
      --accent-strong: #0f56cf;
      --danger: #c2410c;
      --danger-soft: rgba(194, 65, 12, 0.14);
      --success: #0f9f6e;
      --shadow: 0 24px 70px rgba(15, 23, 42, 0.08);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --content: 1320px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(31, 111, 255, 0.12), transparent 28%),
        radial-gradient(circle at top right, rgba(255, 255, 255, 0.9), transparent 36%),
        linear-gradient(180deg, #f9fafb 0%, #eef1f5 100%);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .shell {
      width: min(calc(100% - 24px), var(--content));
      margin: 18px auto 28px;
      display: grid;
      gap: 18px;
    }

    .glass {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    .hero {
      border-radius: 30px;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-strong);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .hero p:last-child {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.6;
      max-width: 720px;
    }

    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat {
      min-width: 126px;
      padding: 16px 18px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
    }

    .stat strong {
      display: block;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    .stat span {
      display: block;
      margin-top: 6px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .toolbar {
      border-radius: var(--radius-xl);
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
    }

    .toolbar-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .segmented {
      display: inline-flex;
      padding: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
    }

    .segmented button,
    .ghost,
    .primary,
    .danger {
      border-radius: 999px;
      padding: 12px 16px;
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .segmented button {
      background: transparent;
      color: var(--muted);
      font-weight: 700;
    }

    .segmented button.active {
      background: #ffffff;
      color: var(--text);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
    }

    .ghost {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--line);
      color: var(--text);
      font-weight: 600;
    }

    .primary {
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(31, 111, 255, 0.24);
    }

    .danger {
      background: var(--danger-soft);
      color: var(--danger);
      font-weight: 700;
    }

    .ghost:hover,
    .primary:hover,
    .danger:hover,
    .segmented button:hover {
      transform: translateY(-1px);
    }

    .period-label {
      min-width: 180px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.85fr);
      gap: 18px;
      align-items: start;
    }

    .card {
      border-radius: var(--radius-xl);
      padding: 18px;
    }

    .calendar-head {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .calendar-head div {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.08em;
    }

    .calendar-grid.month {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .calendar-grid.week {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
    }

    .day-cell {
      min-height: 126px;
      border-radius: 22px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.62);
      padding: 14px;
      display: grid;
      gap: 12px;
      align-content: start;
      text-align: left;
      position: relative;
    }

    .day-cell.other {
      opacity: 0.5;
    }

    .day-cell.today {
      border-color: rgba(31, 111, 255, 0.22);
      background: linear-gradient(180deg, rgba(31, 111, 255, 0.12), rgba(255, 255, 255, 0.78));
    }

    .day-cell.selected {
      border-color: rgba(31, 111, 255, 0.4);
      box-shadow: inset 0 0 0 1px rgba(31, 111, 255, 0.12);
    }

    .day-cell.week-mode {
      min-height: 200px;
    }

    .day-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .day-number {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .today .day-number,
    .selected .day-number {
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
    }

    .booking-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      max-width: 100%;
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .day-preview {
      display: grid;
      gap: 6px;
      min-height: 42px;
      align-content: start;
    }

    .preview-line {
      padding: 7px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid rgba(15, 23, 42, 0.04);
    }

    .note-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 5px rgba(15, 159, 110, 0.12);
      position: absolute;
      right: 14px;
      bottom: 14px;
    }

    .detail {
      display: grid;
      gap: 16px;
    }

    .mobile-form-close {
      display: none;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .detail-header h2,
    .panel-title {
      margin: 0;
      font-size: 26px;
      letter-spacing: -0.04em;
    }

    .detail-header p,
    .panel-subtitle,
    .helper {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .panel {
      border-radius: var(--radius-lg);
      background: var(--panel-strong);
      border: 1px solid var(--line);
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .summary-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .summary-box {
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(244, 246, 248, 0.9);
      border: 1px solid rgba(15, 23, 42, 0.05);
    }

    .summary-box strong {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .summary-box span {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .booking-list {
      display: grid;
      gap: 10px;
    }

    .booking-item {
      padding: 14px;
      border-radius: 18px;
      border: 1px solid rgba(15, 23, 42, 0.06);
      background: rgba(248, 249, 251, 0.9);
      display: grid;
      gap: 10px;
    }

    .booking-main {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: start;
    }

    .booking-main strong {
      display: block;
      font-size: 18px;
      letter-spacing: -0.03em;
    }

    .booking-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .booking-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .small-button {
      padding: 9px 12px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }

    .empty-state {
      padding: 20px;
      border-radius: 18px;
      background: rgba(248, 249, 251, 0.82);
      color: var(--muted);
      text-align: center;
      border: 1px dashed rgba(15, 23, 42, 0.08);
      line-height: 1.6;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    input,
    textarea {
      width: 100%;
      border-radius: 16px;
      border: 1px solid var(--line-strong);
      background: rgba(255, 255, 255, 0.96);
      padding: 13px 14px;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: rgba(31, 111, 255, 0.38);
      box-shadow: 0 0 0 4px rgba(31, 111, 255, 0.12);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    .status {
      min-height: 22px;
      margin: 0;
      font-size: 13px;
      font-weight: 700;
    }

    .status.ok {
      color: var(--success);
    }

    .status.warn {
      color: var(--danger);
    }

    .footer-note {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      padding-bottom: 8px;
    }

    .detail-screen {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      padding: 12px;
      background: rgba(242, 244, 247, 0.84);
      backdrop-filter: blur(18px);
    }

    .detail-screen.open {
      display: block;
    }

    .detail-screen-shell {
      width: min(100%, 520px);
      height: 100%;
      margin: 0 auto;
      padding: 18px 4px 18px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 16px;
    }

    .detail-screen-top {
      display: grid;
      gap: 16px;
    }

    .detail-nav {
      display: grid;
      grid-template-columns: 52px 1fr 52px;
      align-items: center;
      gap: 12px;
    }

    .nav-arrow {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid var(--line);
      color: #b8bec9;
      font-size: 24px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
    }

    .detail-screen-date {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.05em;
    }

    .detail-screen-date span {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0;
      margin-top: 6px;
    }

    .close-detail {
      width: 100%;
      border-radius: 18px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid var(--line);
      font-weight: 700;
      color: var(--text);
    }

    .detail-screen-body {
      overflow: auto;
      padding-right: 4px;
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .detail-block {
      min-height: 92px;
      border-radius: 18px;
      background: rgba(214, 214, 214, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.65);
      padding: 18px;
      display: grid;
      gap: 10px;
      align-content: center;
      color: #111827;
      text-align: left;
    }

    .detail-block.header-actions {
      background: rgba(255, 255, 255, 0.92);
      border-color: rgba(15, 23, 42, 0.06);
      min-height: auto;
      gap: 14px;
    }

    .detail-block.empty {
      color: var(--muted);
      justify-items: center;
      text-align: center;
      background: rgba(226, 226, 226, 0.85);
    }

    .detail-block strong {
      font-size: 22px;
      letter-spacing: -0.04em;
    }

    .detail-block p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .detail-block .meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      color: rgba(17, 24, 39, 0.74);
    }

    .detail-note-card {
      background: rgba(255, 255, 255, 0.92);
      border-color: rgba(15, 23, 42, 0.06);
      min-height: auto;
      align-content: start;
    }

    .detail-note-card.empty {
      justify-items: start;
      text-align: left;
      color: var(--muted);
    }

    @media (max-width: 1080px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 780px) {
      .shell {
        width: min(calc(100% - 14px), var(--content));
        margin: 10px auto 24px;
      }

      .hero,
      .toolbar,
      .card {
        border-radius: 24px;
      }

      .hero {
        padding: 20px;
        flex-direction: column;
        align-items: stretch;
      }

      .stats {
        justify-content: stretch;
      }

      .stat {
        flex: 1 1 0;
      }

      .calendar-grid.month,
      .calendar-grid.week,
      .calendar-head {
        gap: 8px;
      }

      .day-cell {
        min-height: 102px;
        padding: 12px;
        border-radius: 18px;
      }

      .day-cell.week-mode {
        min-height: 148px;
      }

      .detail-header h2,
      .panel-title {
        font-size: 22px;
      }

      #bookingFormCard {
        display: none;
      }

      #bookingFormCard.mobile-open {
        position: fixed;
        inset: 0;
        z-index: 55;
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 14px;
        border-radius: 0;
        overflow: auto;
        background: rgba(242, 244, 247, 0.94);
        backdrop-filter: blur(16px);
      }

      #bookingFormCard.mobile-open .mobile-form-close {
        display: block;
        width: 100%;
        border-radius: 18px;
        padding: 14px 16px;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid var(--line);
        color: var(--text);
        font-weight: 700;
      }
    }

    @media (max-width: 560px) {
      .form-grid,
      .summary-row {
        grid-template-columns: 1fr;
      }

      .toolbar {
        padding: 14px;
      }

      .toolbar-row {
        width: 100%;
        justify-content: space-between;
      }

      .period-label {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 20px;
      }

      .calendar-head div {
        font-size: 11px;
      }

      .day-number {
        width: 30px;
        height: 30px;
        font-size: 14px;
      }

      .preview-line {
        padding: 6px 8px;
        font-size: 11px;
      }

      .calendar-grid.week .day-cell {
        min-width: 0;
        padding: 10px 8px;
      }

      .calendar-grid.week .day-top {
        align-items: flex-start;
        gap: 4px;
      }

      .calendar-grid.week .booking-chip {
        min-width: 0;
        height: 20px;
        padding: 0;
        background: transparent;
        box-shadow: none;
        font-size: 10px;
        line-height: 1;
        letter-spacing: -0.02em;
      }
    }

    @media (min-width: 781px) {
      .detail-screen {
        padding: 28px;
      }

      .detail-screen-shell {
        width: min(100%, 640px);
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="hero glass">
      <div>
        <p class="eyebrow">Private Booking Flow</p>
        <h1>Palja Jib Planner</h1>
      </div>
      <div class="stats">
        <div class="stat">
          <strong>오늘 예약</strong>
          <span id="todayCount">0</span>
        </div>
        <div class="stat">
          <strong>이번 주 예약</strong>
          <span id="weekCount">0</span>
        </div>
        <div class="stat">
          <strong>이번 달 예약</strong>
          <span id="monthCount">0</span>
        </div>
      </div>
    </header>

    <section class="toolbar glass">
      <div class="toolbar-row">
        <div class="segmented" aria-label="캘린더 보기 선택">
          <button type="button" data-view="month" class="active">월간</button>
          <button type="button" data-view="week">주간</button>
        </div>
        <button type="button" class="ghost" id="todayButton">오늘로 이동</button>
      </div>
      <div class="toolbar-row">
        <button type="button" class="ghost" id="prevButton">이전</button>
        <div class="period-label" id="periodLabel"></div>
        <button type="button" class="ghost" id="nextButton">다음</button>
      </div>
    </section>

    <section class="layout">
      <section class="card glass">
        <div class="calendar-head" id="calendarHead"></div>
        <div class="calendar-grid month" id="calendarGrid"></div>
      </section>

      <aside class="detail">
        <section class="card glass">
          <div class="detail-header">
            <div>
              <h2 id="selectedDateLabel"></h2>
              <p id="selectedDateSubtext"></p>
            </div>
            <button type="button" class="primary" id="scrollToFormButton">예약 추가</button>
          </div>

          <div class="summary-row">
            <div class="summary-box">
              <strong>예약 현황</strong>
              <span id="selectedCountLabel">0건</span>
            </div>
            <div class="summary-box">
              <strong>일일 노트</strong>
              <span id="noteStateLabel">없음</span>
            </div>
          </div>

          <section class="panel">
            <div>
              <h3 class="panel-title">예약 리스트</h3>
              <p class="panel-subtitle">이름, 전화번호, 시간대가 시간순으로 표시됩니다.</p>
            </div>
            <div class="booking-list" id="bookingList"></div>
          </section>
        </section>

        <section class="card glass" id="bookingFormCard">
          <button type="button" class="mobile-form-close" id="mobileFormCloseButton">입력 닫기</button>
          <section class="panel">
            <div>
              <h3 class="panel-title" id="formTitle">예약 추가</h3>
              <p class="panel-subtitle">선택한 날짜에 시간대별 예약을 등록할 수 있습니다.</p>
            </div>

            <form id="bookingForm">
              <div class="form-grid">
                <label>
                  예약 시간
                  <input type="time" id="timeInput" required>
                </label>
                <label>
                  고객 이름
                  <input type="text" id="nameInput" maxlength="20" required>
                </label>
              </div>

              <div class="form-grid">
                <label>
                  전화번호
                  <input type="tel" id="phoneInput" maxlength="20" required>
                </label>
                <label>
                  시술 메모
                  <input type="text" id="serviceInput" maxlength="40">
                </label>
              </div>

              <div class="toolbar-row">
                <button type="submit" class="primary" id="submitButton">예약 저장</button>
                <button type="button" class="ghost" id="cancelEditButton" hidden>수정 취소</button>
              </div>
            </form>

            <p class="status" id="bookingStatus" aria-live="polite"></p>
          </section>

          <section class="panel">
            <div>
              <h3 class="panel-title">일일 상세 노트</h3>
              <p class="panel-subtitle">해당 날짜에 필요한 준비물, 고객 요청, 휴무 메모 등을 자유롭게 남길 수 있습니다.</p>
            </div>
            <label>
              노트
              <textarea id="dayNoteInput"></textarea>
            </label>
            <div class="toolbar-row">
              <button type="button" class="primary" id="saveNoteButton">노트 저장</button>
              <button type="button" class="danger" id="clearNoteButton">노트 삭제</button>
            </div>
            <p class="status" id="noteStatus" aria-live="polite"></p>
          </section>
        </section>
      </aside>
    </section>

    <p class="footer-note">데이터는 현재 브라우저의 로컬 저장소에만 저장됩니다.</p>
  </div>

  <section class="detail-screen" id="detailScreen" aria-hidden="true">
    <div class="detail-screen-shell">
      <div class="detail-screen-top">
        <div class="detail-nav">
          <button type="button" class="nav-arrow" id="detailPrevButton" aria-label="이전 날짜">‹</button>
          <div class="detail-screen-date" id="detailScreenDate"></div>
          <button type="button" class="nav-arrow" id="detailNextButton" aria-label="다음 날짜">›</button>
        </div>
        <button type="button" class="close-detail" id="detailCloseButton">캘린더로 닫기</button>
      </div>

      <div class="detail-screen-body" id="detailScreenBody"></div>
    </div>
  </section>

  <script>
    const STORAGE_KEY = "nail-reserve-planner-v1";
    const DAYS = ["일", "월", "화", "수", "목", "금", "토"];
    const today = createDateOnly(new Date());
    const state = {
      view: "month",
      currentDate: createDateOnly(new Date()),
      selectedDate: createDateOnly(new Date()),
      editingId: null,
      detailScreenOpen: false,
      bookingFormOpen: false,
      data: loadData()
    };

    const calendarHead = document.getElementById("calendarHead");
    const calendarGrid = document.getElementById("calendarGrid");
    const periodLabel = document.getElementById("periodLabel");
    const selectedDateLabel = document.getElementById("selectedDateLabel");
    const selectedDateSubtext = document.getElementById("selectedDateSubtext");
    const selectedCountLabel = document.getElementById("selectedCountLabel");
    const noteStateLabel = document.getElementById("noteStateLabel");
    const bookingList = document.getElementById("bookingList");
    const bookingForm = document.getElementById("bookingForm");
    const formTitle = document.getElementById("formTitle");
    const timeInput = document.getElementById("timeInput");
    const nameInput = document.getElementById("nameInput");
    const phoneInput = document.getElementById("phoneInput");
    const serviceInput = document.getElementById("serviceInput");
    const submitButton = document.getElementById("submitButton");
    const cancelEditButton = document.getElementById("cancelEditButton");
    const bookingStatus = document.getElementById("bookingStatus");
    const dayNoteInput = document.getElementById("dayNoteInput");
    const noteStatus = document.getElementById("noteStatus");
    const todayCount = document.getElementById("todayCount");
    const weekCount = document.getElementById("weekCount");
    const monthCount = document.getElementById("monthCount");
    const scrollToFormButton = document.getElementById("scrollToFormButton");
    const bookingFormCard = document.getElementById("bookingFormCard");
    const mobileFormCloseButton = document.getElementById("mobileFormCloseButton");
    const detailScreen = document.getElementById("detailScreen");
    const detailScreenDate = document.getElementById("detailScreenDate");
    const detailScreenBody = document.getElementById("detailScreenBody");

    document.querySelectorAll("[data-view]").forEach((button) => {
      button.addEventListener("click", () => {
        state.view = button.dataset.view;
        document.querySelectorAll("[data-view]").forEach((item) => item.classList.toggle("active", item === button));
        render();
      });
    });

    document.getElementById("todayButton").addEventListener("click", () => {
      state.currentDate = createDateOnly(new Date());
      state.selectedDate = createDateOnly(new Date());
      render();
    });

    document.getElementById("prevButton").addEventListener("click", () => {
      state.currentDate = state.view === "month"
        ? addMonths(state.currentDate, -1)
        : addDays(state.currentDate, -7);
      render();
    });

    document.getElementById("nextButton").addEventListener("click", () => {
      state.currentDate = state.view === "month"
        ? addMonths(state.currentDate, 1)
        : addDays(state.currentDate, 7);
      render();
    });

    scrollToFormButton.addEventListener("click", openBookingForm);
    mobileFormCloseButton.addEventListener("click", closeBookingForm);

    document.getElementById("detailCloseButton").addEventListener("click", closeDetailScreen);
    document.getElementById("detailPrevButton").addEventListener("click", () => moveDetailDate(-1));
    document.getElementById("detailNextButton").addEventListener("click", () => moveDetailDate(1));

    bookingForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const dateKey = formatDateKey(state.selectedDate);
      const dayData = getDayData(dateKey);
      const bookings = [...dayData.bookings];
      const previousEditingId = state.editingId;
      const payload = {
        id: previousEditingId ?? createId(),
        time: timeInput.value,
        name: nameInput.value.trim(),
        phone: phoneInput.value.trim(),
        service: serviceInput.value.trim()
      };

      if (!payload.time || !payload.name || !payload.phone) {
        setStatus(bookingStatus, "시간, 이름, 전화번호는 필수입니다.", "warn");
        return;
      }

      const duplicateTime = bookings.some((booking) => booking.time === payload.time && booking.id !== payload.id);
      if (duplicateTime) {
        setStatus(bookingStatus, "같은 날짜에 동일한 시간대 예약이 이미 있습니다.", "warn");
        return;
      }

      const nextBookings = previousEditingId
        ? bookings.map((booking) => booking.id === payload.id ? payload : booking)
        : [...bookings, payload];

      state.data[dateKey] = {
        ...dayData,
        bookings: sortBookings(nextBookings)
      };
      persist();
      resetBookingForm();
      setStatus(bookingStatus, previousEditingId ? "예약을 수정했습니다." : "예약을 저장했습니다.", "ok");
      closeBookingForm();
      render();
      if (state.detailScreenOpen) {
        renderDetailScreen();
      }
    });

    cancelEditButton.addEventListener("click", () => {
      resetBookingForm();
      setStatus(bookingStatus, "예약 수정이 취소되었습니다.", "ok");
      closeBookingForm();
    });

    document.getElementById("saveNoteButton").addEventListener("click", () => {
      const dateKey = formatDateKey(state.selectedDate);
      const dayData = getDayData(dateKey);
      state.data[dateKey] = {
        ...dayData,
        note: dayNoteInput.value.trim()
      };
      persist();
      setStatus(noteStatus, "일일 노트를 저장했습니다.", "ok");
      render();
      if (state.detailScreenOpen) {
        renderDetailScreen();
      }
    });

    document.getElementById("clearNoteButton").addEventListener("click", () => {
      const dateKey = formatDateKey(state.selectedDate);
      const dayData = getDayData(dateKey);
      state.data[dateKey] = {
        ...dayData,
        note: ""
      };
      persist();
      dayNoteInput.value = "";
      setStatus(noteStatus, "일일 노트를 삭제했습니다.", "ok");
      render();
      if (state.detailScreenOpen) {
        renderDetailScreen();
      }
    });

    function render() {
      renderCalendarHead();
      renderCalendar();
      renderDetail();
      renderStats();
      renderDetailScreen();
      renderBookingFormCard();
    }

    function renderCalendarHead() {
      calendarHead.innerHTML = DAYS.map((day) => `<div>${day}</div>`).join("");
    }

    function renderCalendar() {
      calendarGrid.className = `calendar-grid ${state.view}`;
      const cells = state.view === "month" ? buildMonthCells(state.currentDate) : buildWeekCells(state.currentDate);
      periodLabel.textContent = state.view === "month"
        ? `${state.currentDate.getFullYear()}년 ${state.currentDate.getMonth() + 1}월`
        : getWeekLabel(state.currentDate);

      calendarGrid.innerHTML = "";

      cells.forEach((date) => {
        const dateKey = formatDateKey(date);
        const dayData = getDayData(dateKey);
        const inCurrentMonth = date.getMonth() === state.currentDate.getMonth();
        const isToday = isSameDate(date, today);
        const isSelected = isSameDate(date, state.selectedDate);
        const previews = dayData.bookings.slice(0, state.view === "month" ? 2 : 4);
        const button = document.createElement("button");

        button.type = "button";
        button.className = [
          "day-cell",
          state.view === "week" ? "week-mode" : "",
          inCurrentMonth ? "" : "other",
          isToday ? "today" : "",
          isSelected ? "selected" : ""
        ].filter(Boolean).join(" ");

        button.innerHTML = `
          <div class="day-top">
            <span class="day-number">${date.getDate()}</span>
            <span class="booking-chip">${dayData.bookings.length}건</span>
          </div>
          <div class="day-preview">
            ${previews.map((booking) => `<div class="preview-line">${escapeHtml(booking.time)} ${escapeHtml(booking.name)}</div>`).join("")}
          </div>
          ${dayData.note ? '<span class="note-dot" aria-label="노트 있음"></span>' : ""}
        `;

        button.addEventListener("click", () => {
          state.selectedDate = createDateOnly(date);
          setStatus(bookingStatus, "", "");
          setStatus(noteStatus, "", "");
          openDetailScreen();
          render();
        });

        calendarGrid.appendChild(button);
      });
    }

    function renderDetail() {
      const dateKey = formatDateKey(state.selectedDate);
      const dayData = getDayData(dateKey);
      selectedDateLabel.textContent = formatDateLabel(state.selectedDate);
      selectedDateSubtext.textContent = `${DAYS[state.selectedDate.getDay()]}요일 · 예약 ${dayData.bookings.length}건`;
      selectedCountLabel.textContent = `${dayData.bookings.length}건`;
      noteStateLabel.textContent = dayData.note ? "작성됨" : "없음";
      dayNoteInput.value = dayData.note;

      bookingList.innerHTML = "";
      if (dayData.bookings.length === 0) {
        bookingList.innerHTML = '<div class="empty-state">등록된 예약이 없습니다.<br>아래 폼에서 첫 예약을 추가하세요.</div>';
      } else {
        dayData.bookings.forEach((booking) => {
          const item = document.createElement("article");
          item.className = "booking-item";
          item.innerHTML = `
            <div class="booking-main">
              <div>
                <strong>${escapeHtml(booking.name)}</strong>
                <div class="booking-meta">
                  <span>${escapeHtml(booking.time)}</span>
                  <span>${escapeHtml(booking.phone)}</span>
                  ${booking.service ? `<span>${escapeHtml(booking.service)}</span>` : ""}
                </div>
              </div>
              <div class="booking-actions">
                <button type="button" class="small-button" data-action="edit">수정</button>
                <button type="button" class="small-button" data-action="delete">삭제</button>
              </div>
            </div>
          `;

          item.querySelector('[data-action="edit"]').addEventListener("click", () => {
            state.editingId = booking.id;
            formTitle.textContent = "예약 수정";
            submitButton.textContent = "수정 저장";
            cancelEditButton.hidden = false;
            timeInput.value = booking.time;
            nameInput.value = booking.name;
            phoneInput.value = booking.phone;
            serviceInput.value = booking.service || "";
            openBookingForm();
            setStatus(bookingStatus, "수정 중인 예약을 불러왔습니다.", "ok");
          });

          item.querySelector('[data-action="delete"]').addEventListener("click", () => {
            state.data[dateKey] = {
              ...dayData,
              bookings: dayData.bookings.filter((current) => current.id !== booking.id)
            };
            persist();
            if (state.editingId === booking.id) {
              resetBookingForm();
            }
            setStatus(bookingStatus, "예약을 삭제했습니다.", "ok");
            render();
            if (state.detailScreenOpen) {
              renderDetailScreen();
            }
          });

          bookingList.appendChild(item);
        });
      }
    }

    function renderStats() {
      todayCount.textContent = getDayData(formatDateKey(today)).bookings.length;
      weekCount.textContent = countBookingsInRange(startOfWeek(today), addDays(startOfWeek(today), 6));
      monthCount.textContent = countBookingsInRange(startOfMonth(today), endOfMonth(today));
    }

    function getDayData(dateKey) {
      return state.data[dateKey] ?? { note: "", bookings: [] };
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return {};
        }

        const parsed = JSON.parse(raw);
        return typeof parsed === "object" && parsed ? parsed : {};
      } catch {
        return {};
      }
    }

    function resetBookingForm() {
      state.editingId = null;
      bookingForm.reset();
      formTitle.textContent = "예약 추가";
      submitButton.textContent = "예약 저장";
      cancelEditButton.hidden = true;
    }

    function openDetailScreen() {
      state.detailScreenOpen = true;
    }

    function closeDetailScreen() {
      state.detailScreenOpen = false;
      renderDetailScreen();
    }

    function moveDetailDate(offset) {
      state.selectedDate = addDays(state.selectedDate, offset);
      state.currentDate = state.view === "month"
        ? createDateOnly(new Date(state.selectedDate.getFullYear(), state.selectedDate.getMonth(), 1))
        : createDateOnly(state.selectedDate);
      setStatus(bookingStatus, "", "");
      setStatus(noteStatus, "", "");
      render();
    }

    function openBookingForm() {
      if (isMobileViewport()) {
        state.bookingFormOpen = true;
        if (state.detailScreenOpen) {
          state.detailScreenOpen = false;
        }
        renderDetailScreen();
        renderBookingFormCard();
        window.setTimeout(() => timeInput.focus(), 60);
        return;
      }

      bookingFormCard.scrollIntoView({ behavior: "smooth", block: "start" });
      timeInput.focus();
    }

    function closeBookingForm() {
      state.bookingFormOpen = false;
      renderBookingFormCard();
    }

    function renderBookingFormCard() {
      bookingFormCard.classList.toggle("mobile-open", isMobileViewport() && state.bookingFormOpen);
    }

    function renderDetailScreen() {
      detailScreen.classList.toggle("open", state.detailScreenOpen);
      detailScreen.setAttribute("aria-hidden", String(!state.detailScreenOpen));
      if (!state.detailScreenOpen) {
        return;
      }

      const dayData = getDayData(formatDateKey(state.selectedDate));
      detailScreenDate.innerHTML = `
        ${state.selectedDate.getMonth() + 1}/${state.selectedDate.getDate()} ${DAYS[state.selectedDate.getDay()]}요일
        <span>예약 ${dayData.bookings.length}건</span>
      `;

      const noteCard = dayData.note
        ? `
          <article class="detail-block detail-note-card">
            <strong>일일 노트</strong>
            <p>${escapeHtml(dayData.note).replaceAll("\n", "<br>")}</p>
          </article>
        `
        : `
          <article class="detail-block detail-note-card empty">
            <strong>일일 노트</strong>
            <p>아직 저장된 노트가 없습니다.</p>
          </article>
        `;

      const bookingsMarkup = dayData.bookings.length
        ? dayData.bookings.map((booking) => `
          <article class="detail-block">
            <strong>${escapeHtml(booking.time)}</strong>
            <p>${escapeHtml(booking.name)}</p>
            <div class="meta-line">
              <span>${escapeHtml(booking.phone)}</span>
              ${booking.service ? `<span>${escapeHtml(booking.service)}</span>` : ""}
            </div>
          </article>
        `).join("")
        : `
          <article class="detail-block empty">
            <strong>예약 없음</strong>
            <p>이 날짜에는 아직 등록된 예약이 없습니다.</p>
          </article>
        `;

      detailScreenBody.innerHTML = `
        <article class="detail-block header-actions">
          <strong>${formatDateLabel(state.selectedDate)}</strong>
          <p>이 날짜의 예약 리스트와 노트를 빠르게 확인하고 아래 버튼으로 바로 예약을 추가할 수 있습니다.</p>
          <button type="button" class="primary" id="detailAddBookingButton">예약 추가</button>
        </article>
        ${noteCard}
        ${bookingsMarkup}
      `;

      document.getElementById("detailAddBookingButton").addEventListener("click", () => {
        openBookingForm();
      });
    }

    function isMobileViewport() {
      return window.innerWidth <= 780;
    }

    function buildMonthCells(baseDate) {
      const first = startOfWeek(startOfMonth(baseDate));
      return Array.from({ length: 42 }, (_, index) => addDays(first, index));
    }

    function buildWeekCells(baseDate) {
      const first = startOfWeek(baseDate);
      return Array.from({ length: 7 }, (_, index) => addDays(first, index));
    }

    function getWeekLabel(baseDate) {
      const first = startOfWeek(baseDate);
      const last = addDays(first, 6);
      return `${first.getMonth() + 1}월 ${first.getDate()}일 - ${last.getMonth() + 1}월 ${last.getDate()}일`;
    }

    function countBookingsInRange(startDate, endDate) {
      let total = 0;
      let cursor = createDateOnly(startDate);
      while (cursor <= endDate) {
        total += getDayData(formatDateKey(cursor)).bookings.length;
        cursor = addDays(cursor, 1);
      }
      return total;
    }

    function sortBookings(bookings) {
      return bookings.slice().sort((a, b) => a.time.localeCompare(b.time));
    }

    function createId() {
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function addDays(date, amount) {
      const next = new Date(date);
      next.setDate(next.getDate() + amount);
      return createDateOnly(next);
    }

    function addMonths(date, amount) {
      return createDateOnly(new Date(date.getFullYear(), date.getMonth() + amount, 1));
    }

    function startOfMonth(date) {
      return new Date(date.getFullYear(), date.getMonth(), 1);
    }

    function endOfMonth(date) {
      return new Date(date.getFullYear(), date.getMonth() + 1, 0);
    }

    function startOfWeek(date) {
      const clone = createDateOnly(date);
      return addDays(clone, -clone.getDay());
    }

    function formatDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatDateLabel(date) {
      return `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일`;
    }

    function createDateOnly(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function isSameDate(left, right) {
      return formatDateKey(left) === formatDateKey(right);
    }

    function setStatus(element, message, type) {
      element.textContent = message;
      element.className = `status ${type}`.trim();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    window.addEventListener("resize", () => {
      if (!isMobileViewport()) {
        state.bookingFormOpen = false;
      }
      renderBookingFormCard();
    });

    render();
  </script>
</body>
</html>
